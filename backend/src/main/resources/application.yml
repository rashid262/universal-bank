server:
  address: 0.0.0.0
  # Render (and most hosts) inject PORT
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    # Brevo also accepts 2525 where a host blocks 587
    port: ${MAIL_PORT:587}
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    # true = on startup, set the admin password to ADMIN_INITIAL_PASSWORD (forgotten-password recovery)
    password-reset: ${ADMIN_PASSWORD_RESET:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
  mail:
    # Sender address; must be verified in Brevo
    from: ${MAIL_FROM}
  fx:
    base-url: https://api.frankfurter.dev
  verification:
    url: ${APP_BASE_URL}/api/v1/auth/verify?token=